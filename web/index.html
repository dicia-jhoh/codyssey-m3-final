<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>또박또박 — 고지서 해독기</title>
  <link rel="icon" href="/assets/brand/web/favicon.ico" sizes="48x48">
  <link rel="icon" href="/assets/brand/web/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/brand/web/apple-touch-icon.png">
  <meta name="theme-color" content="#8052FF">
  <link rel="stylesheet" href="style.css?v=20261023a">
</head>
<body>
  <!-- 담당: 송유영. API 는 같은 주소(/decode · /share) -->
  <header>
    <div class="header-top">
      <h1><img class="logo" src="/assets/brand/ttobak-horizontal.svg" alt="또박또박" width="230" height="56"></h1>
      <button id="textSizeBtn" class="text-size" type="button" aria-pressed="false">글자 크게</button>
    </div>
    <p>고지서 사진 한 장이면 「얼마를 · 언제까지 · 무엇을」</p>
  </header>

  <main>
    <p id="grandchildNotice" class="banner notice" hidden>손주 모드 — 가족이 찍은 고지서의 해독 결과예요. 사진 원본은 공유되지 않아요.</p>

    <div id="upload-section">
      <label class="upload">
        고지서 사진 찍기 · 고르기
        <input id="photo" type="file" accept="image/*" capture="environment">
      </label>
    </div>

    <p id="status" role="status"></p>
    <p id="sample" class="banner" hidden>샘플 모드 — 실제 고지서 풀이가 아니에요</p>

    <section id="result" hidden>
      <p class="ai-notice" id="aiNotice"></p>
      <h2 id="title"></h2>

      <!-- 3색 빨간펜: 사진 위에 bbox 비율로 상자를 얹는다. 손주 모드는 사진 원본이 없어서 이 구역 자체를 숨긴다 -->
      <div class="paper" id="photoSection">
        <img id="preview" alt="올린 고지서 사진">
        <div id="marks"></div>
      </div>
      <p class="legend"><span class="money">낼 돈</span> <span class="deadline">기한</span> <span class="document">챙길 서류</span></p>

      <h3>할 일</h3>
      <ul id="todos" class="cards"></ul>

      <h3>쉬운 말 풀이와 근거</h3>
      <ul id="basis"></ul>

      <!-- 손주 모드: 해독 결과(사진 제외)를 짧은 링크로 가족에게 보낸다(FR-07) -->
      <button id="shareBtn" type="button" class="share">가족에게 보내기</button>
      <p id="shareResult" class="share-result"></p>
    </section>
  </main>

  <script src="app.js?v=20261023a"></script>
</body>
</html>
